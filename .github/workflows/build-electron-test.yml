# Variante de test du workflow de la PR #9 (build-electron.yml) : au lieu de
# se déclencher sur un tag v*, il se déclenche au push de cette branche et
# publie les .exe dans une Release de test (préversion), pour valider la
# chaîne de compilation cloud et fournir un exécutable téléchargeable sans
# attendre la fusion. Supprimable à tout moment (Release + branche).
name: Build de test .exe (branche vibe)

on:
  push:
    branches: ['vibe/exe-build-test-6c2f8a']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Build web officiel de WordCraft, embarqué dans le .exe comme il l'est
      # sur le site Pages (le protocole host exige la même origine). Version
      # épinglée + somme SHA256 vérifiée ; en cas d'échec l'app se construit
      # quand même et l'app OCR retombe sur l'éditeur distant.
      - name: Intégrer le build web WordCraft (apps/wordcraft/)
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '0.18.1'
          $rel = "https://github.com/storytold/wordcraft/releases/download/v$ver"
          $zip = Join-Path $env:TEMP 'wordcraft-web.zip'
          Invoke-WebRequest "${rel}/wordcraft-web-${ver}.zip" -OutFile $zip
          Invoke-WebRequest "${rel}/SHA256SUMS.txt" -OutFile "$env:TEMP\SHA256SUMS.txt"
          $expected = ((Select-String -Path "$env:TEMP\SHA256SUMS.txt" -Pattern "wordcraft-web-$ver\.zip$").Line -split '\s+')[0]
          if (-not $expected) { throw "SHA256 introuvable pour wordcraft-web-$ver.zip" }
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected.ToLower()) { throw "SHA256 invalide : $actual != $expected" }
          $tmp = Join-Path $env:TEMP 'wordcraft-web'
          Expand-Archive $zip -DestinationPath $tmp -Force
          New-Item -ItemType Directory -Force apps/wordcraft | Out-Null
          Copy-Item (Join-Path $tmp "wordcraft-web-$ver\*") apps/wordcraft/ -Recurse -Force
          if (-not (Test-Path 'apps/wordcraft/index.html')) { throw 'index.html manquant' }
          Write-Host "WordCraft $ver intégré"

      - name: Installer les dépendances
        working-directory: electron
        shell: pwsh
        run: |
          $log = npm install --no-audit --no-fund --foreground-scripts 2>&1
          $code = $LASTEXITCODE
          $log | ForEach-Object { Write-Host "$_" }
          if ($code -ne 0) {
            $errs = ($log | Where-Object { $_ -match '^npm error' -and $_ -notmatch 'Usage|Options|\[--|\[-w|aliases|Run "npm help' } | Select-Object -First 20) -join ' | '
            if ($errs.Length -gt 900) { $errs = $errs.Substring(0, 900) }
            Write-Host "::error::npm ci a echoue (exit $code) : $errs"
            exit $code
          }

      - name: Construire l'installateur NSIS et le portable
        working-directory: electron
        run: npm run dist:win

      # electron-updater telecharge l'installateur sous le nom exact inscrit
      # dans latest.yml (espaces remplacees par des tirets), mais l'action de
      # Release remplace les espaces des noms de fichiers par des points :
      # les deux ne coincideraient jamais. On aligne donc les fichiers de
      # dist/ sur l'URL de latest.yml avant la publication.
      # --- Diagnostic : le .exe livre une page Focus vide. On verifie les
      # ressources embarquees, on capture la console JS des pages dans le
      # vrai environnement (exe de win-unpacked, protocole app://), et on
      # publie resources/app en zip pour inspection hors ligne.
      - name: Diagnostic ressources embarquees
        shell: pwsh
        run: |
          $app = 'dist/win-unpacked/resources/app'
          $attendus = @(
            'index.html','sw.js','manifest.webmanifest',
            'assets/js/apps.js','assets/js/common.js','assets/js/launcher.js',
            'assets/css/design.css',
            'apps/focus/index.html','apps/focus/focus.js','apps/focus/core.js','apps/focus/focus.css',
            'apps/ocr/index.html','apps/revision/index.html','apps/probabilites/index.html',
            'docs/recherche-focus-tda-tsa.md'
          )
          $manquants = @($attendus | Where-Object { -not (Test-Path (Join-Path $app $_)) })
          $nb = (Get-ChildItem $app -Recurse -File | Measure-Object).Count
          Write-Host "resources/app : $nb fichiers"
          if ($manquants.Count -gt 0) {
            Write-Host "::error::Manquants dans resources/app : $($manquants -join ', ') (total $nb)"
          } else {
            Write-Host "::error::Diagnostic ressources OK : $nb fichiers, rien de manquant"
          }
          Compress-Archive -Path "$app/*" -DestinationPath dist/resources-app.zip -Force

      - name: Diagnostic devtools page accueil
        shell: pwsh
        run: |
          $env:LENANCKER_URL = 'app://local/index.html'
          $env:DIAG_OUT = 'diag-win-home'
          $p = Start-Process -FilePath 'dist/win-unpacked/Lenancker Launcher.exe' -ArgumentList '--disable-gpu','--remote-debugging-port=9222' -PassThru
          $out = node electron/diag.js 2>&1 | Out-String
          Write-Host $out
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if (Test-Path 'diag-win-home.json') {
            $j = Get-Content diag-win-home.json -Raw | ConvertFrom-Json
            $ev = ($j.events | Select-Object -First 10) -join ' | '
            Write-Host "::error::[WIN accueil] etat: $($j.state) ; problemes: $($j.problems -join ' ; ') ; evenements: $ev"
          } else { Write-Host "::error::[WIN accueil] devtools sans resultat (exe sans doute non lance sur le runner)" }

      - name: Diagnostic devtools page Focus
        shell: pwsh
        run: |
          $env:LENANCKER_URL = 'app://local/apps/focus/index.html'
          $env:DIAG_OUT = 'diag-win-focus'
          $p = Start-Process -FilePath 'dist/win-unpacked/Lenancker Launcher.exe' -ArgumentList '--disable-gpu','--remote-debugging-port=9222' -PassThru
          $out = node electron/diag.js 2>&1 | Out-String
          Write-Host $out
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if (Test-Path 'diag-win-focus.json') {
            $j = Get-Content diag-win-focus.json -Raw | ConvertFrom-Json
            $ev = ($j.events | Select-Object -First 10) -join ' | '
            Write-Host "::error::[WIN focus] etat: $($j.state) ; problemes: $($j.problems -join ' ; ') ; evenements: $ev"
          } else { Write-Host "::error::[WIN focus] devtools sans resultat (exe sans doute non lance sur le runner)" }

      - name: Aligner les noms des .exe sur latest.yml
        shell: pwsh
        run: |
          $yml = Get-Content dist/latest.yml -Raw
          $url = [regex]::Match($yml, 'url:\s*(\S+)').Groups[1].Value
          if (-not $url) { throw 'URL introuvable dans latest.yml' }
          $setup = Get-ChildItem dist -Filter '*Setup*.exe' | Select-Object -First 1
          Rename-Item $setup.FullName $url
          Rename-Item "$($setup.FullName).blockmap" "$url.blockmap"
          Get-ChildItem dist -Filter '*.exe' | Where-Object { $_.Name -ne $url } | ForEach-Object {
            Rename-Item $_.FullName ($_.Name -replace ' ', '-')
          }
          Get-ChildItem dist | ForEach-Object { Write-Host $_.Name }

      - name: Publier les .exe en artefacts du run
        uses: actions/upload-artifact@v4
        with:
          name: lenancker-launcher-win-x64
          path: dist/*.exe
          if-no-files-found: error

      - name: Créer la Release de test avec les .exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: exe-test-2026-11-17-v2
          name: Exe de test (compilation cloud)
          prerelease: true
          generate_release_notes: false
          body: |
            Compilation de test générée automatiquement par GitHub Actions
            depuis la branche `vibe/exe-build-test-6c2f8a`.

            Contenu : code de `main` + les changements de couleur de la
            PR #10 (chaque app adopte la couleur de sa carte d'accueil).

            - Installateur NSIS et version portable, non signés : au premier
              lancement, Windows SmartScreen peut demander
              « Informations complémentaires → Exécuter quand même ».
            - Cette Release est un test supprimable sans risque ; la chaîne
              officielle est décrite dans la PR #9 (Release sur les tags v*).
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
            dist/resources-app.zip
            diag-win-home.json
            diag-win-home.png
            diag-win-focus.json
            diag-win-focus.png

  diag-linux:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

      - name: Installer les dependances electron
        working-directory: electron
        run: npm install --no-audit --no-fund

      - name: Test H accueil temoin
        working-directory: electron
        shell: bash
        run: |
          LENANCKER_URL='app://local/index.html' LENANCKER_EVENTS=ev-home.jsonl xvfb-run -a npx electron . --disable-gpu --no-sandbox --remote-debugging-port=9222 &
          sleep 3
          DIAG_OUT=diag-v3-home timeout 60 node diag.js >/dev/null 2>&1 || true
          pkill -f electron || true
          echo "::error::[H accueil temoin] diag=$(head -c 300 diag-v3-home.json 2>/dev/null || echo vide) ; events=$(tr '\n' '|' < ev-home.jsonl 2>/dev/null | head -c 300 || echo vide)"

      - name: Test F focus sans common.js
        working-directory: electron
        shell: bash
        run: |
          sed -i 's|<script src="../../assets/js/common.js" defer></script>|<script defer>/* desactive */</script>|' ../apps/focus/index.html
          LENANCKER_URL='app://local/apps/focus/index.html' LENANCKER_EVENTS=ev-nocommon.jsonl xvfb-run -a npx electron . --disable-gpu --no-sandbox --remote-debugging-port=9222 &
          sleep 3
          DIAG_OUT=diag-v3-nocommon timeout 60 node diag.js >/dev/null 2>&1 || true
          pkill -f electron || true
          git -C .. checkout -- apps/focus/index.html
          echo "::error::[F focus sans common.js] diag=$(head -c 300 diag-v3-nocommon.json 2>/dev/null || echo vide) ; events=$(tr '\n' '|' < ev-nocommon.jsonl 2>/dev/null | head -c 500 || echo vide)"

      - name: Test G focus sans aucun script
        working-directory: electron
        shell: bash
        run: |
          sed -i -e 's|<script src="../../assets/js/common.js" defer></script>|<script defer>/* off */</script>|' -e 's|<script src="core.js" defer></script>|<script defer>/* off */</script>|' -e 's|<script src="focus.js" defer></script>|<script defer>/* off */</script>|' ../apps/focus/index.html
          LENANCKER_URL='app://local/apps/focus/index.html' LENANCKER_EVENTS=ev-noscript.jsonl xvfb-run -a npx electron . --disable-gpu --no-sandbox --remote-debugging-port=9222 &
          sleep 3
          DIAG_OUT=diag-v3-noscript timeout 60 node diag.js >/dev/null 2>&1 || true
          pkill -f electron || true
          git -C .. checkout -- apps/focus/index.html
          echo "::error::[G focus sans script] diag=$(head -c 300 diag-v3-noscript.json 2>/dev/null || echo vide) ; events=$(tr '\n' '|' < ev-noscript.jsonl 2>/dev/null | head -c 500 || echo vide)"

      - name: Test I focus sans script ni focus.css
        working-directory: electron
        shell: bash
        run: |
          sed -i -e 's|<script src="../../assets/js/common.js" defer></script>|<script defer>/* off */</script>|' -e 's|<script src="core.js" defer></script>|<script defer>/* off */</script>|' -e 's|<script src="focus.js" defer></script>|<script defer>/* off */</script>|' -e 's|<link rel="stylesheet" href="focus.css">|<link rel="stylesheet" href="data:text/css,">|' ../apps/focus/index.html
          LENANCKER_URL='app://local/apps/focus/index.html' LENANCKER_EVENTS=ev-nofocuscss.jsonl xvfb-run -a npx electron . --disable-gpu --no-sandbox --remote-debugging-port=9222 &
          sleep 3
          DIAG_OUT=diag-v3-nofocuscss timeout 60 node diag.js >/dev/null 2>&1 || true
          pkill -f electron || true
          git -C .. checkout -- apps/focus/index.html
          echo "::error::[I focus sans script ni focus.css] diag=$(head -c 300 diag-v3-nofocuscss.json 2>/dev/null || echo vide) ; events=$(tr '\n' '|' < ev-nofocuscss.jsonl 2>/dev/null | head -c 500 || echo vide)"

      - name: Attacher les resultats a la Release de test
        uses: softprops/action-gh-release@v2
        with:
          tag_name: exe-test-2026-11-17-v2
          files: |
            electron/diag-v3-home.json
            electron/diag-v3-nocommon.json
            electron/diag-v3-noscript.json
            electron/diag-v3-nofocuscss.json
            electron/ev-home.jsonl
            electron/ev-nocommon.jsonl
            electron/ev-noscript.jsonl
            electron/ev-nofocuscss.jsonl
