name: Construire l'app Windows (.exe)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm install et non npm ci : le package-lock.json du dépôt a été
      # généré hors Windows et omet des paquets optionnels win32 (ex.
      # electron-builder-squirrel-windows), ce que npm ci refuse sur un
      # runner Windows (« Missing ... from lock file »). npm install
      # complète l'arborescence sur place ; le build est identique.
      - name: Installer les dépendances
        working-directory: electron
        run: npm install --no-audit --no-fund

      # Sur un tag v1.0.1, l'exécutable porte cette version (au lieu du 1.0.0
      # figé dans electron/package.json).
      - name: Aligner la version sur le tag
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: electron
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.argv[1];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');console.log('version alignée :',process.argv[1]);" "$V"

      - name: Construire l'installateur NSIS et le portable
        working-directory: electron
        run: npm run dist:win

      # electron-updater telecharge l'installateur sous le nom exact inscrit
      # dans latest.yml (espaces remplacees par des tirets), mais l'action de
      # Release remplace les espaces des noms de fichiers par des points :
      # les deux ne coincideraient jamais. On aligne donc les fichiers de
      # dist/ sur l'URL de latest.yml avant la publication.
      - name: Aligner les noms des .exe sur latest.yml
        shell: pwsh
        run: |
          $yml = Get-Content dist/latest.yml -Raw
          $url = [regex]::Match($yml, 'url:\s*(\S+)').Groups[1].Value
          if (-not $url) { throw 'URL introuvable dans latest.yml' }
          $setup = Get-ChildItem dist -Filter '*Setup*.exe' | Select-Object -First 1
          Rename-Item $setup.FullName $url
          Rename-Item "$($setup.FullName).blockmap" "$url.blockmap"
          Get-ChildItem dist -Filter '*.exe' | Where-Object { $_.Name -ne $url } | ForEach-Object {
            Rename-Item $_.FullName ($_.Name -replace ' ', '-')
          }
          Get-ChildItem dist | ForEach-Object { Write-Host $_.Name }

      - name: Publier les .exe en artefacts du run
        uses: actions/upload-artifact@v4
        with:
          name: lenancker-launcher-win-x64
          path: dist/*.exe
          if-no-files-found: error

      - name: Créer la Release GitHub avec les .exe
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          generate_release_notes: true
